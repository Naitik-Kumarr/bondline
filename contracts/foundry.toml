[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "../deployments" },
]

[fuzz]
runs = 1000
seed = "0xb0d11e"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
rhTestnet = "https://rpc.testnet.chain.robinhood.com"
rhMainnet = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
# Immutables keep camelCase getters that match the interfaces; `1 << i` is an intended bit mask;
# keccak256 of calldata is clearer than assembly; modifiers are tiny.
exclude_lints = ["screaming-snake-case-immutable", "incorrect-shift", "asm-keccak256", "unwrapped-modifier-logic"]
