[package]
name = "bondline-pricer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bondline reference price (docs/PRICING.md) as an integer-only Stylus contract"
publish = false

[dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.10"

[dev-dependencies]
serde_json = "1"

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "bondline-pricer"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
